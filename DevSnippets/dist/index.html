<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevSnippets — Biblioteca de conocimiento técnico y gestor de snippets offline">
    <title>DevSnippets</title>

    <!-- ── Librerías externas (locales / offline) ── -->
    <link rel="stylesheet" href="libs/highlight/github-dark-dimmed.min.css">

    <!-- ── CSS Módulos ── -->
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- ════════════════════════════════════════════
         PANEL LATERAL (Sidebar)
         ════════════════════════════════════════════ -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Navegación</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav">
            <!-- Autogenerado por sidebar.js -->
        </nav>
    </aside>

    <!-- ════════════════════════════════════════════
         CONTENIDO PRINCIPAL
         ════════════════════════════════════════════ -->
    <div id="main-content">

        <!-- ── Header ── -->
        <header id="app-header">
            <div class="header-row">
                <div class="header-left">
                    <!-- Botón toggle sidebar -->
                    <button id="sidebar-toggle" class="btn-toggle" title="Alternar panel lateral"
                        onclick="Sidebar.toggle()">
                        <svg data-lucide="panel-left" width="18" height="18"></svg>
                    </button>

                    <h1 class="app-title">DevSnippets <span>Ultra</span></h1>
                </div>

                <div class="header-right">
                    <!-- Nuevo Título -->
                    <button class="btn-primary" onclick="Editor.addTitle()" title="Añadir nuevo título principal">
                        <svg data-lucide="folder-plus" width="15" height="15"></svg>
                        Nuevo Título
                    </button>

                    <!-- Guardar Manual (TODO Tauri) -->
                    <button class="btn" onclick="App.saveManual()" title="Guardar cambios">
                        <svg data-lucide="save" width="15" height="15"></svg>
                        Guardar
                    </button>

                    <!-- Tema -->
                    <button id="theme-btn" class="btn-toggle" title="Alternar tema" onclick="App.toggleTheme()">
                        <svg data-lucide="sun" width="17" height="17"></svg>
                    </button>

                    <!-- Más opciones (Export/Import) -->
                    <div class="dropdown">
                        <button class="btn-toggle" title="Opciones" onclick="App.toggleDropdown(event,'main-options-menu')">
                            <svg data-lucide="settings" width="17" height="17"></svg>
                        </button>
                        <div id="main-options-menu" class="dropdown-menu">
                            <button class="dropdown-item" onclick="App.exportJSON()">
                                <svg data-lucide="download" width="14" height="14"></svg>
                                Exportar JSON
                            </button>
                            <button class="dropdown-item" onclick="document.getElementById('import-file').click()">
                                <svg data-lucide="upload" width="14" height="14"></svg>
                                Importar JSON
                            </button>
                        </div>
                    </div>

                    <!-- Input oculto para importar -->
                    <input type="file" id="import-file" accept=".json" style="display:none">
                </div>
            </div>

            <!-- Barra de estadísticas -->
            <div id="stats-bar">Cargando...</div>

            <!-- Buscador -->
            <div class="search-wrapper">
                <span class="search-icon">
                    <svg data-lucide="search" width="15" height="15"></svg>
                </span>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Buscar por título, categoría, subtítulo, código..."
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>
        </header>

        <!-- ── Área de contenido scrollable ── -->
        <div id="app-scroll">
            <div id="app-container">
                <!-- Autogenerado por render.js -->
            </div>
        </div>
    </div>

    <!-- ════════════════════════════════════════════
         TOAST DE NOTIFICACIONES
         ════════════════════════════════════════════ -->
    <div id="toast" role="status" aria-live="polite">
        <span id="toast-msg"></span>
        <button id="toast-undo-btn" class="btn-undo" onclick="App.undoAction()" style="display:none">
            <svg data-lucide="rotate-ccw" width="13" height="13"></svg>
            Deshacer
        </button>
        <button class="btn-close btn-icon" onclick="document.getElementById('toast').classList.remove('show')" title="Cerrar">
            <svg data-lucide="x" width="14" height="14"></svg>
        </button>
    </div>

    <!-- ════════════════════════════════════════════
         LIBRERÍAS JS (locales)
         ════════════════════════════════════════════ -->
    <script src="libs/highlight/highlight.min.js"></script>
    <script src="libs/sortable/sortable.min.js"></script>
    <script src="libs/lucide/lucide.min.js"></script>

    <!-- ════════════════════════════════════════════
         MÓDULOS DE LA APLICACIÓN
         (Orden importante: dependencias primero)
         ════════════════════════════════════════════ -->
    <script src="js/storage.js"></script>
    <script src="js/search.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>

    <!-- Inicializar íconos Lucide en el HTML estático del header/toast -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>

</body>
</html>
